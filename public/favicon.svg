<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="diceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="diceFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#diceBg)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Die Body -->
  <rect x="12" y="12" width="40" height="40" rx="10" fill="url(#diceFace)" filter="url(#glow)"/>
  <rect x="12" y="12" width="40" height="40" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- 5 Pips -->
  <circle cx="22" cy="22" r="3.6" fill="#1e293b"/>
  <circle cx="42" cy="22" r="3.6" fill="#1e293b"/>
  <circle cx="32" cy="32" r="4.8" fill="#ef4444"/>
  <circle cx="22" cy="42" r="3.6" fill="#1e293b"/>
  <circle cx="42" cy="42" r="3.6" fill="#1e293b"/>
</svg>
